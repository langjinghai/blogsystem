# ============================================================
#  BlogSystem — Docker 容器内 nginx 配置
#  构建时复制到 /etc/nginx/conf.d/default.conf
#  后端通过 Compose 服务名 backend:8080 访问
# ============================================================

# /user/{id} 既是前端路由，也是后端 API。
# 浏览器访问（Accept 含 text/html）返回 SPA，axios 请求代理到后端。
map $http_accept $blog_accept_html {
    default 0;
    ~*text/html 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 10m;

    # Docker 内置 DNS，配合变量 proxy_pass 避免后端重建后 IP 变化
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # ---------- 前端 SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- 后端 API ----------
    location /user/      { proxy_pass $backend$request_uri; }
    location /category/  { proxy_pass $backend$request_uri; }
    location /comment    { proxy_pass $backend$request_uri; }
    location /like/      { proxy_pass $backend$request_uri; }
    location /upload/    { proxy_pass $backend$request_uri; }
    location /follow     { proxy_pass $backend$request_uri; }

    location = /article              { proxy_pass $backend$request_uri; }
    location = /article/page         { proxy_pass $backend$request_uri; }
    location = /article/hot          { proxy_pass $backend$request_uri; }
    location = /article/latest       { proxy_pass $backend$request_uri; }
    location = /article/my           { proxy_pass $backend$request_uri; }
    location ~ ^/article/\d+$        { proxy_pass $backend$request_uri; }
    location ~ ^/article/\d+/like$   { proxy_pass $backend$request_uri; }
    location ~ ^/article/\d+/view$   { proxy_pass $backend$request_uri; }
    location ~ ^/article/user/\d+$   { proxy_pass $backend$request_uri; }

    # /user/{id}：浏览器走 SPA，接口走后端
    location ~ ^/user/\d+$ {
        if ($blog_accept_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass $backend$request_uri;
    }
}
