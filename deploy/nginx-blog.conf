# ============================================================
#  BlogSystem — nginx 站点配置（Linux）
#  放置位置：
#    Ubuntu/Debian: /etc/nginx/sites-available/blogsystem.conf
#    CentOS/RHEL:   /etc/nginx/conf.d/blogsystem.conf
#  使用前把 server_name 改成你的域名或服务器 IP。
# ============================================================

# /user/{id} 既是前端路由（用户主页），也是后端 API。
# 浏览器直接访问时 Accept 含 text/html → 返回 SPA；
# axios 请求时 Accept 为 application/json → 代理到后端。
map $http_accept $blog_accept_html {
    default 0;
    ~*text/html 1;
}

server {
    listen 80;
    server_name _;

    root /var/www/blogsystem;
    index index.html;
    charset utf-8;
    client_max_body_size 10m;
    server_tokens off;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：脚本只允许同源，阻止文章里注入的 inline onerror/onload 等
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # 反向代理公共配置（server 级，所有 location 继承）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # ---------- 前端 SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        # 用 expires 而不是 add_header，避免覆盖 server 级安全响应头（CSP 等）
        expires -1;
    }

    # Vite 构建产物带 hash，可长期缓存
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # ---------- 后端 API ----------
    location /user/      { proxy_pass http://127.0.0.1:8080; }
    location /category/  { proxy_pass http://127.0.0.1:8080; }
    location /comment    { proxy_pass http://127.0.0.1:8080; }
    location /like/      { proxy_pass http://127.0.0.1:8080; }
    location /upload/    { proxy_pass http://127.0.0.1:8080; }
    location /follow     { proxy_pass http://127.0.0.1:8080; }

    location = /article              { proxy_pass http://127.0.0.1:8080; }
    location = /article/page         { proxy_pass http://127.0.0.1:8080; }
    location = /article/hot          { proxy_pass http://127.0.0.1:8080; }
    location = /article/latest       { proxy_pass http://127.0.0.1:8080; }
    location = /article/my           { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/article/\d+$        { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/article/\d+/like$   { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/article/\d+/view$   { proxy_pass http://127.0.0.1:8080; }
    location ~ ^/article/user/\d+$   { proxy_pass http://127.0.0.1:8080; }

    # /user/{id}：浏览器访问走 SPA，接口请求走后端
    location ~ ^/user/\d+$ {
        if ($blog_accept_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8080;
    }
}
