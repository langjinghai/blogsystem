
server:
  port: 8080

spring:
  # 本地敏感配置放在 application-local.yaml（已 gitignore），不提交到仓库
  config:
    import:
      - optional:file:./application-local.yaml
      - optional:file:./blogSystem/application-local.yaml
      - optional:file:../application-local.yaml

  application:
    name: blog

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/blogsystem?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 5MB

logging:
  level:
    com.example.springbootproject: info

mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  # 实体类包路径，用于类型别名
  type-aliases-package: com.example.springbootproject.pojo
  configuration:
    # 开启驼峰命名转换（数据库下划线转Java驼峰）
    map-underscore-to-camel-case: true
    # 生产/默认关闭 SQL 参数日志，避免手机号、密码等进入日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
aliyun:
  oss:
    endpoint: oss-cn-shenzhen.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: blogsystems

