
server:
  port: 8080

spring:
  application:
    name: blog

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blogsystem?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: CHANGE_ME

  redis:
      host: 192.168.88.130
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 5MB

logging:
  level:
    com.example.springbootproject: debug

mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  # 实体类包路径，用于类型别名
  type-aliases-package: com.example.springbootproject.pojo
  configuration:
    # 开启驼峰命名转换（数据库下划线转Java驼峰）
    map-underscore-to-camel-case: true
    # 配置SQL日志输出到控制台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
aliyun:
  oss:
    endpoint: oss-cn-shenzhen.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: blogsystems

